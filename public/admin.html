<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Gaviota — Envíos Masivos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2b5b84;
      --primary-hover: #1f4362;
      --bg: #f4f7f9;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #718096;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 35px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-header h1 {
      color: var(--primary);
      font-size: 1.5rem;
      font-weight: 700;
    }
    .brand-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 8px;
      color: var(--text);
    }
    input[type="text"],
    input[type="password"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(43, 91, 132, 0.15);
    }

    /* Subida de Imagen */
    .file-dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #fafbfc;
      transition: background 0.2s, border-color 0.2s;
      position: relative;
    }
    .file-dropzone:hover {
      background: #f0f4f8;
      border-color: var(--primary);
    }
    .file-dropzone input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }
    .dropzone-text {
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    .dropzone-text strong {
      color: var(--primary);
    }

    /* Previsualización de Imagen */
    .image-preview {
      margin-top: 12px;
      display: none;
      text-align: center;
    }
    .image-preview img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      border: 1px solid var(--border);
      object-fit: cover;
    }

    /* Botón */
    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }

    .hidden { display: none !important; }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

  <!-- CARD 1: INICIO DE SESIÓN -->
  <div id="loginCard" class="card">
    <div class="brand-header">
      <h1>Casa Gaviota A.C.</h1>
      <p>Panel de Envíos Masivos</p>
    </div>
    
    <div id="loginAlert" class="alert alert-error"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="adminPass">Contraseña de acceso:</label>
        <input type="password" id="adminPass" required placeholder="Ingresa la contraseña">
      </div>
      <button type="submit" class="btn">Ingresar al Panel</button>
    </form>
  </div>

  <!-- CARD 2: FORMULARIO DE ENVÍO -->
  <div id="panelCard" class="card hidden">
    <div class="brand-header">
      <h1>Redactar Comunicado</h1>
      <p>El mensaje se enviará a la lista de MongoDB</p>
    </div>

    <div id="statusAlert" class="alert"></div>

    <form id="campaignForm" onsubmit="handleSendCampaign(event)">
      <div class="form-group">
        <label for="asunto">Asunto del Correo *</label>
        <input type="text" id="asunto" name="asunto" required placeholder="Ej. ¡Nueva convocatoria de talleres de apoyo!">
      </div>

      <div class="form-group">
        <label for="mensaje">Mensaje / Comunicado *</label>
        <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escribe aquí el texto principal del comunicado..."></textarea>
      </div>

      <div class="form-group">
        <label>Imagen o Flyer del Comunicado</label>
        <div class="file-dropzone">
          <input type="file" id="imagenInput" name="imagen" accept="image/*" onchange="previewImage(event)">
          <div class="dropzone-text">
            <span>📷 <strong>Haz clic aquí</strong> o arrastra una imagen (.jpg, .png)</span>
          </div>
        </div>
        <div id="imagePreviewContainer" class="image-preview">
          <img id="imagePreview" src="" alt="Previsualización">
        </div>
      </div>

      <div class="form-group">
        <label for="enlace">Enlace de botón (Opcional)</label>
        <input type="url" id="enlace" name="enlace" placeholder="https://casagaviota.org.mx/registro">
      </div>

      <button type="submit" id="submitBtn" class="btn"> Enviar Comunicado</button>
    </form>
  </div>

  <script>
    // Manejo de inicio de sesión
    async function handleLogin(e) {
      e.preventDefault();
      const password = document.getElementById('adminPass').value;
      const alertBox = document.getElementById('loginAlert');
      
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        const data = await res.json();

        if (data.success) {
          document.getElementById('loginCard').classList.add('hidden');
          document.getElementById('panelCard').classList.remove('hidden');
        } else {
          alertBox.innerText = data.error || 'Contraseña incorrecta';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.innerText = 'Error de conexión con el servidor';
        alertBox.style.display = 'block';
      }
    }

    // Previsualizar la imagen antes de subirla
    function previewImage(event) {
      const file = event.target.files[0];
      const previewContainer = document.getElementById('imagePreviewContainer');
      const previewImg = document.getElementById('imagePreview');

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          previewImg.src = e.target.result;
          previewContainer.style.display = 'block';
        }
        reader.readAsDataURL(file);
      } else {
        previewContainer.style.display = 'none';
      }
    }

    // Envío del formulario
    async function handleSendCampaign(e) {
      e.preventDefault();
      
      const form = document.getElementById('campaignForm');
      const submitBtn = document.getElementById('submitBtn');
      const statusAlert = document.getElementById('statusAlert');
      
      const formData = new FormData(form);

      submitBtn.disabled = true;
      submitBtn.innerText = 'Enviando comunicado...';
      statusAlert.style.display = 'none';

      try {
        const res = await fetch('/api/admin/send-campaign', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (data.success) {
          statusAlert.className = 'alert alert-success';
          statusAlert.innerText = `¡Campaña enviada con éxito a ${data.total} usuarias!`;
          statusAlert.style.display = 'block';
          form.reset();
          document.getElementById('imagePreviewContainer').style.display = 'none';
        } else {
          statusAlert.className = 'alert alert-error';
          statusAlert.innerText = 'Error: ' + (data.error || 'No se pudo enviar el comunicado');
          statusAlert.style.display = 'block';
        }
      } catch (err) {
        statusAlert.className = 'alert alert-error';
        statusAlert.innerText = 'Error de red o servidor al procesar el envío';
        statusAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = ' Enviar Comunicado';
      }
    }
  </script>
</body>
</html>
